[project]
name = "soft404"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "beautifulsoup4==4.12.2",
    "catboost==1.2.2",
    "goose3==3.1.17",
    "matplotlib==3.8.2",
    "nltk==3.8.1",
    "numpy>=1.26.2",
    "pandas>=2.1.3",
    "requests>=2.31.0",
    "urllib3>=2.1.0",
    "streamlit==1.29.0",
    "tqdm==4.66.1",
    "transformers==4.35.2",
    "urllib3==2.1.0"
]

[project.optional-dependencies]
cpu = ["torch==2.7.0"]
gpu = ["torch==2.7.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.setuptools.packages.find]
include = ["*"]